name: Build installeurs
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev dpkg-dev libfuse2t64
      - run: flutter pub get && flutter build linux --release
      - run: bash packaging/linux/build_deb.sh "${GITHUB_REF_NAME#v}"
        if: startsWith(github.ref, 'refs/tags/')
      - run: bash packaging/linux/build_deb.sh 1.0.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: bash packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/*.deb
            build/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get; flutter build windows --release
      - run: choco install innosetup -y
      - run: iscc packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/Guens-Travel-7-Tours-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
